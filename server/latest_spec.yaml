{
  "name": "climateai",
  "services": [
    {
      "name": "backend",
      "github": {
        "repo": "leanderdulac/ClimateAI",
        "branch": "main",
        "deploy_on_push": true
      },
      "dockerfile_path": "server/Dockerfile",
      "source_dir": ".",
      "envs": [
        {
          "key": "PYTHONUNBUFFERED",
          "value": "1",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "ENVIRONMENT",
          "value": "production",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "API_PREFIX",
          "value": "/v1",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "DATABASE_URL",
          "value": "postgresql+asyncpg://postgres.tyzmywhvpmdfepxdtyes:K9r9s9n9a9###$@aws-1-sa-east-1.pooler.supabase.com:6543/postgres?prepared_statement_cache_size=0",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "SUPABASE_URL",
          "value": "https://tyzmywhvpmdfepxdtyes.supabase.co",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "SUPABASE_ANON_KEY",
          "value": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5em15d2h2cG1kZmVweGR0eWVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4NzAzNjcsImV4cCI6MjA4NDQ0NjM2N30.14R4jz5hzgx6u3pPnMDrnBEUmgorb0Iqlb8spQRgzaI",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "EMBRAPA_API_KEY",
          "value": "8da8971c-0118-39c9-bb67-07653e6f664b",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "EMBRAPA_API_URL",
          "value": "https://api.cnptia.embrapa.br",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "EMBRAPA_API_VERSION",
          "value": "climapi/v1",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "NOAA_API_KEY",
          "value": "WDjhFaVSxFFpLelfYoKaQjnaTorOMcfV",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "DATABASE_ENABLED",
          "value": "true",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "DEBUG",
          "value": "false",
          "scope": "RUN_AND_BUILD_TIME"
        },
        {
          "key": "SECRET_KEY",
          "scope": "RUN_TIME",
          "type": "SECRET"
        },
        {
          "key": "ALLOW_ORIGINS",
          "value": "*",
          "scope": "RUN_AND_BUILD_TIME"
        }
      ],
      "instance_size_slug": "professional-xs",
      "instance_count": 1,
      "http_port": 8000,
      "health_check": {
        "http_path": "/health"
      }
    }
  ],
  "static_sites": [
    {
      "name": "frontend",
      "github": {
        "repo": "leanderdulac/ClimateAI",
        "branch": "main",
        "deploy_on_push": true
      },
      "build_command": "npm install && npm run build",
      "source_dir": "client",
      "output_dir": "dist",
      "envs": [
        {
          "key": "VITE_API_BASE_URL",
          "value": "",
          "scope": "BUILD_TIME"
        }
      ],
      "catchall_document": "index.html"
    }
  ],
  "region": "nyc",
  "ingress": {
    "rules": [
      {
        "match": {
          "path": {
            "prefix": "/api"
          }
        },
        "component": {
          "name": "backend"
        }
      },
      {
        "match": {
          "path": {
            "prefix": "/"
          }
        },
        "component": {
          "name": "frontend"
        }
      }
    ]
  }
}
