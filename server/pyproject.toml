[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py *_test.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    -v
"""
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, requires components)",
    "performance: Performance tests (may take longer)",
    "slow: Slow running tests",
    "auth: Authentication related tests",
    "requires_db: Tests that require database",
    "requires_redis: Tests that require Redis",
    "async_context: Tests that require async context",
    "requires_server: Tests that require a running server",
]
asyncio_mode = "auto"
log_cli = false
log_file = "tests.log"
timeout = 300
timeout_method = "thread"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "venv",
    ".venv",
    "env",
    ".env",
    "build",
    "dist",
    "*.egg-info",
    ".cache",
    ".coverage",
    "htmlcov",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = "server"
skip = ["venv", ".venv", "env", ".env", "__pycache__"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | \.cache
  | \.coverage
  | htmlcov
)/
'''

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "venv-hathor"]
skips = ["B101", "B311"]  # Skip assert warnings and random warnings for non-crypto use
