[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    venv,
    .venv,
    env,
    .env,
    build,
    dist,
    *.egg-info,
    .cache,
    .coverage,
    htmlcov

[isort]
profile = black
multi_line_output = 3
line_length = 88
known_first_party = server
skip =
    venv,
    .venv,
    env,
    .env,
    __pycache__

[black]
line-length = 88
target-version = ['py311']
include = \.pyi?$
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | \.cache
  | \.coverage
  | htmlcov
)/
'''