---
version: "2.0"

services:
  climatewise-inference:
    image: ghcr.io/leanderdulac/climatewise-inference:latest
    expose:
      - port: 8001
        as: 8001
        to:
          - global: true
    env:
      - PORT=8001
      - LOG_LEVEL=INFO
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - CUDA_VISIBLE_DEVICES=0

profiles:
  compute:
    climatewise-inference:
      resources:
        cpu:
          units: 4.0
        memory:
          size: 16Gi
        storage:
          size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx4090
                - model: a100
                - model: a6000
                - model: l40s

  placement:
    akash:
      attributes:
        host: akash
      signedBy:
        anyOf:
          - akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63 # Audited / Overclock Labs
      pricing:
        climatewise-inference:
          denom: uakt
          amount: 100000

deployment:
  climatewise-inference:
    akash:
      profile: climatewise-inference
      count: 1
