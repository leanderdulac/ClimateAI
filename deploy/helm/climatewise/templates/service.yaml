apiVersion: v1
kind: Service
metadata:
  name: {{ include "climatewise.fullname" . }}-api
  labels:
    {{- include "climatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "climatewise.name" . }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "climatewise.fullname" . }}-inference
  labels:
    {{- include "climatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  type: {{ .Values.inference.service.type }}
  ports:
    - port: {{ .Values.inference.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "climatewise.name" . }}
    app.kubernetes.io/component: inference
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "climatewise.fullname" . }}-client
  labels:
    {{- include "climatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  ports:
    - port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "climatewise.name" . }}
    app.kubernetes.io/component: client
