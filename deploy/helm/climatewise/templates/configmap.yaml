apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "climatewise.fullname" . }}-config
  labels:
    {{- include "climatewise.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  DEBUG: {{ .Values.env.DEBUG | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  INFERENCE_SERVICE_URL: {{ .Values.env.INFERENCE_SERVICE_URL | quote }}
  REDIS_ENABLED: {{ .Values.env.REDIS_ENABLED | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  RATE_LIMITING_ENABLED: {{ .Values.env.RATE_LIMITING_ENABLED | quote }}
