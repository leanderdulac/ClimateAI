name: CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Backend dependency audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.0.8
        with:
          inputs: "server/requirements.txt"
        continue-on-error: false

      - name: Frontend audit (npm audit high)
        run: |
          cd client
          npm ci
          npm audit --omit=dev --audit-level=high
        continue-on-error: false

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (fast lane)
        env:
          PYTEST_ADDOPTS: -m "not integration and not slow and not requires_db and not requires_redis" --disable-warnings --maxfail=1
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        env:
          CI: true
        run: npm run test:run
