name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Executar diariamente às 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  # ============================================
  # SAST - Static Application Security Testing
  # ============================================
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript"
          output: sarif-results
          upload: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results

  # ============================================
  # Python Security Audit
  # ============================================
  python-security:
    name: Python Security (pip-audit + Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit bandit safety

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-results.json || true
          pip-audit --output-format columns
        continue-on-error: false

      - name: Run Bandit SAST
        run: |
          bandit -r . -f json -o bandit-results.json --severity-level medium --confidence-level medium || true
          bandit -r . --severity-level medium --confidence-level medium
        continue-on-error: false

      - name: Run Safety check
        run: |
          safety check --json --output safety-results.json || true
          safety check
        continue-on-error: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-results
          path: |
            server/pip-audit-results.json
            server/bandit-results.json
            server/safety-results.json

  # ============================================
  # JavaScript Security Audit
  # ============================================
  javascript-security:
    name: JavaScript Security (npm audit + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-results.json || true
          npm audit --omit=dev --audit-level=moderate
        continue-on-error: false

      - name: Run ESLint with security plugin
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint . --format json --output-file eslint-results.json || true
        continue-on-error: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-security-results
          path: |
            client/npm-audit-results.json
            client/eslint-results.json

  # ============================================
  # DAST - Dynamic Application Security Testing
  # ============================================
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application (Docker Compose)
        run: |
          docker-compose up -d backend
          sleep 30
        continue-on-error: true

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
        continue-on-error: true

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: |
            report_html.html
            report_json.json

  # ============================================
  # Container Security Scan (Trivy)
  # ============================================
  container-security:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t climateai-backend:latest ./server
          docker build -t climateai-frontend:latest .

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'climateai-backend:latest'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'climateai-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload Trivy results (Frontend)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-backend-results.sarif
            trivy-frontend-results.sarif

  # ============================================
  # SBOM Generation (Software Bill of Materials)
  # ============================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (Backend)
        run: |
          syft dir:./server -o cyclonedx-json=server-sbom.json
          syft dir:./server -o spdx-json=server-sbom-spdx.json
        continue-on-error: true

      - name: Generate SBOM (Frontend)
        run: |
          syft dir:./client -o cyclonedx-json=client-sbom.json
          syft dir:./client -o spdx-json=client-sbom-spdx.json
        continue-on-error: true

      - name: Generate SBOM (Docker Images)
        run: |
          docker build -t climateai-backend:latest ./server
          docker build -t climateai-frontend:latest .
          syft climateai-backend:latest -o cyclonedx-json=backend-image-sbom.json
          syft climateai-frontend:latest -o cyclonedx-json=frontend-image-sbom.json
        continue-on-error: true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: |
            server-sbom.json
            server-sbom-spdx.json
            client-sbom.json
            client-sbom-spdx.json
            backend-image-sbom.json
            frontend-image-sbom.json

      - name: Publish SBOM to GitHub Packages
        uses: actions/upload-artifact@v4
        with:
          name: sbom-release
          path: |
            *.json
          retention-days: 90

  # ============================================
  # Secrets Scanning
  # ============================================
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: |
            results.sarif

  # ============================================
  # Dependency Review
  # ============================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-ghsas: []

  # ============================================
  # Security Summary Report
  # ============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast, python-security, javascript-security, dast, container-security, sbom, secrets-scan]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (CodeQL) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Security | ${{ needs.python-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript Security | ${{ needs.javascript-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST (ZAP) | ${{ needs.dast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security (Trivy) | ${{ needs.container-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List artifacts
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Python Security: pip-audit-results.json, bandit-results.json, safety-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript Security: npm-audit-results.json, eslint-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- DAST: report_html.html, report_json.json" >> $GITHUB_STEP_SUMMARY
          echo "- Container Security: trivy-backend-results.sarif, trivy-frontend-results.sarif" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM: server-sbom.json, client-sbom.json, backend-image-sbom.json, frontend-image-sbom.json" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets: results.sarif" >> $GITHUB_STEP_SUMMARY
