name: Performance & Load Testing

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target base URL for load test"
        required: false
        default: "http://localhost:8000"
      users:
        description: "Concurrent simulated users"
        required: false
        default: "50"
      spawn_rate:
        description: "Users spawned per second"
        required: false
        default: "10"
      run_time:
        description: "Duration of load test"
        required: false
        default: "60s"
  schedule:
    # Executar semanalmente aos domingos às 03:00 UTC
    - cron: '0 3 * * 0'

jobs:
  load-test:
    name: Locust Headless Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies and Locust
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install locust

      - name: Start local test server
        env:
          DATABASE_ENABLED: "false"
          DATABASE_URL: "sqlite+aiosqlite:///./.test_db.sqlite"
          SECRET_KEY: "load-test-secret-key-32-chars-long!"
          ENVIRONMENT: "development"
          DEBUG: "true"
          ALLOW_ORIGINS: "*"
        run: |
          cd server
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1

      - name: Execute Locust Load Test
        run: |
          locust -f server/tests/performance/locustfile.py \
            --headless \
            --host ${{ github.event.inputs.target_url || 'http://localhost:8000' }} \
            --users ${{ github.event.inputs.users || 50 }} \
            --spawn-rate ${{ github.event.inputs.spawn_rate || 10 }} \
            --run-time ${{ github.event.inputs.run_time || '30s' }} \
            --html locust-report.html \
            --csv locust-results \
            --exit-code-on-error 1

      - name: Upload Load Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-performance-report
          path: |
            locust-report.html
            locust-results*.csv
