name: Build and Publish Inference Container

on:
  workflow_dispatch:
  push:
    branches:
      - fix/climatewise-audit
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile.inference
          push: true
          tags: |
            ghcr.io/leanderdulac/climatewise-inference:latest
            ghcr.io/leanderdulac/climatewise-inference:${{ github.sha }}
