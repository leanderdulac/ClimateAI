name: climateai
region: nyc
services:
  # Backend Python/FastAPI Service
  - name: backend
    github:
      repo: leanderdulac/ClimateAI
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: server/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs
    routes:
      - path: /api
    health_check:
      http_path: /health
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: "production"

static_sites:
  # Frontend React/Vite Static Site
  - name: frontend
    github:
      repo: leanderdulac/ClimateAI
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm install && npm run build
    output_dir: dist
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE_URL
        value: ${backend.PRIVATE_URL}
    catchall_document: index.html
