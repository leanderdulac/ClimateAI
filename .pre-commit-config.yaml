# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(client/|\.md$)
      - id: end-of-file-fixer
        exclude: ^client/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # Python formatting - Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^server/
        exclude: ^server/(venv|\.venv|__pycache__|\.pytest_cache)/

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        files: ^server/
        exclude: ^server/(venv|\.venv|__pycache__)/

  # Python linting - with recursion limit and exclusions
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        files: ^server/
        exclude: ^server/(venv|\.venv|__pycache__|\.pytest_cache|coverage_html)/
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]
        additional_dependencies: [flake8-bugbear]

  # Python type checking - simplified configuration
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        files: ^server/
        exclude: ^server/(venv|\.venv|tests|__pycache__)/
        args: ["--ignore-missing-imports", "--no-error-summary"]
        additional_dependencies: [types-requests, types-redis]
        pass_filenames: true

  # Python security scanning - using inline args instead of config file
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        files: ^server/
        exclude: ^server/(tests|venv|\.venv)/
        args: ["-r", "--skip=B101,B311", "-ll"]

  # Frontend - ESLint (only when client files change)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd client && npm run lint || true'
        language: system
        files: ^client/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # Frontend - TypeScript check (only when client files change)
  - repo: local
    hooks:
      - id: tsc
        name: typescript-check
        entry: bash -c 'cd client && npm run type-check || true'
        language: system
        files: ^client/.*\.(ts|tsx)$
        pass_filenames: false
