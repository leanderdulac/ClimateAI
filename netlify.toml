# Netlify Build Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory with the deploy-ready HTML files and assets generated by the build
  publish = "client/dist"
  
  # Build command to generate the static website
  command = "cd client && npm install && npm run build"
  
  # Base directory for the build
  base = "/"

[build.environment]
  # Node version
  NODE_VERSION = "18.0.0"
  NPM_VERSION = "8.0.0"

# Redirect rules for Single Page Application (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# API proxy (configure backend URL after deploying backend)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"