# OpenTelemetry Collector Configuration
# Configuração completa para traces, logs e métricas com redaction de PII

receivers:
  # OTLP Receiver (gRPC e HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:3000
            - http://localhost:5173
            - http://localhost:8000
          allowed_headers:
            - Content-Type
            - X-Request-ID
            - Authorization

  # Jaeger Receiver (compatibilidade)
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  # Zipkin Receiver (compatibilidade)
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  # Batch processor para eficiência
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter para proteção
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256

  # Resource detection
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 2s
    override: false

  # Transform para enriquecimento de traces
  transform:
    trace_statements:
      - context: span
        statements:
          # Adicionar timestamp padronizado
          - set(attributes["processed_at"], Now())
          # Normalizar nomes de operação
          - replace_pattern(name, "\\?.*", "")

  # Redaction de PII - CRÍTICO PARA COMPLIANCE
  redaction:
    allow_all_keys: false
    # Chaves sensíveis a serem removidas
    blocked_keys:
      - password
      - secret
      - token
      - api_key
      - apikey
      - authorization
      - cookie
      - set-cookie
      - x-api-key
      - private_key
      - client_secret
      - refresh_token
      - access_token
      - jwt
      - session_id
      - user_id
      - email
      - cpf
      - cnpj
      - credit_card
      - ssn
    # Padrões regex para redaction em valores
    allowed_values: []
    blocked_values:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}'  # Emails
      - '\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'  # CPF
      - '\b\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}\b'  # CNPJ
      - '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'  # Cartão de crédito
    # Campos a serem hashados (em vez de removidos)
    hash_keys:
      - x-request-id
      - traceparent
    # Permitir lista específica de chaves seguras
    allowed_keys:
      - service.name
      - service.version
      - deployment.environment
      - http.method
      - http.url
      - http.status_code
      - http.target
      - http.route
      - db.system
      - db.operation
      - net.peer.name
      - net.peer.port

  # Filtro para sampling inteligente
  filter:
    traces:
      span:
        # Manter todos os erros
        - attributes["http.status_code"] == 500
        - attributes["error"] == true
        # Manter traces lentos (> 1s)
        - duration > 1000000000
        # Amostrar 10% das requisições normais
        - RandomSampling(0.1)

  # Span metrics para gerar métricas a partir de traces
  spanmetrics:
    metrics_exporter: prometheus
    latency_histogram_buckets: [1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: http.method
        default: GET
      - name: http.status_code
        default: 200
      - name: service.name
        default: unknown
      - name: span.kind
        default: internal

  # Probabilistic sampling para produção
  probabilistic_sampler:
    sampling_percentage: 10
    hash_seed: 42

  # Attributes para padronização
  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: team
        value: platform
        action: upsert

exporters:
  # Debug exporter (apenas desenvolvimento)
  debug:
    verbosity: detailed
    sampling_initial: 1
    sampling_thereafter: 100

  # OTLP Exporter para Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000
      num_consumers: 10

  # OTLP Exporter para Zipkin
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
    format: proto

  # OTLP Exporter para Tempo
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  # Prometheus Exporter para métricas
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: climateai
    send_timestamps: true
    metric_expiration: 180m

  # File exporter para backup de traces
  file:
    path: /var/log/otel/traces.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

  # Logging exporter
  logging:
    loglevel: info

extensions:
  # Health check endpoint
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health
    check_collector_pipeline:
      enabled: true
      interval: 60s
      exporter_failure_threshold: 5

  # Prometheus metrics do próprio collector
  pprof:
    endpoint: 0.0.0.0:1777

  # Zpages para debugging
  zpages:
    endpoint: 0.0.0.0:55679

  # SigV4 para AWS (se necessário)
  # sigv4:
  #   region: us-east-1

service:
  extensions:
    - health_check
    - pprof
    - zpages

  pipelines:
    traces:
      receivers:
        - otlp
        - jaeger
        - zipkin
      processors:
        - memory_limiter
        - resourcedetection
        - attributes
        - redaction  # Redaction de PII
        - transform
        - spanmetrics
        - batch
      exporters:
        - otlp/jaeger
        - otlphttp/tempo
        - zipkin
        - debug
        - logging

    metrics:
      receivers:
        - otlp
        - prometheus
        - spanmetrics
      processors:
        - memory_limiter
        - attributes
        - batch
      exporters:
        - prometheus
        - debug
        - logging

    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes
        - redaction  # Redaction de PII em logs
        - batch
      exporters:
        - debug
        - logging

  # Configurações globais
  telemetry:
    logs:
      level: info
      development: false
    metrics:
      level: detailed
      address: 0.0.0.0:8888
