# Prometheus Configuration for ClimateAI
# Monitoramento completo de métricas, SLOs e alertas

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'climateai-monitor'
    environment: '${ENVIRONMENT:-production}'

# Alertmanager configuration (se aplicável)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus auto-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # ClimateAI Backend
  - job_name: 'climateai-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s

  # Node Exporter (infraestrutura)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: /metrics
    scheme: http

  # cAdvisor (containers)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scheme: http

  # External APIs Health (via Blackbox Exporter se necessário)
  # - job_name: 'external-apis'
