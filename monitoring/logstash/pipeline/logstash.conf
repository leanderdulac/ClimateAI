input {
  beats {
    port => 5044
  }

  http {
    port => 8080
    codec => json
  }
}

filter {
  if [kubernetes] {
    mutate {
      add_field => { "container_name" => "%{[kubernetes][container][name]}" }
      add_field => { "namespace" => "%{[kubernetes][namespace]}" }
      add_field => { "pod_name" => "%{[kubernetes][pod][name]}" }
    }
  }

  if [message] and [message] =~ /^\\{/ {
    json {
      source => "message"
    }
  }

  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["timestamp", "beat", "prospector", "input", "offset", "source", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "climateai-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  stdout {
    codec => rubydebug
  }
}